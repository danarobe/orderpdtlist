[build]
  command = "npx vite build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
